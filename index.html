<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Мой дашборд</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s1soft:#cde2fb;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --up:#006300;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s1soft:#184f95; --up:#0ca30c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) 0 84px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:23px;line-height:1.2;margin:0 0 3px;letter-spacing:-.2px}
h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
   color:var(--muted);margin:26px 0 10px}
.sub{color:var(--muted);font-size:12px;margin:0}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:14px}
[hidden]{display:none !important}
.hero{display:flex;align-items:center;gap:16px;margin-top:14px}
.hero .num{font-size:52px;font-weight:600;line-height:1}
.hero .meta{font-size:13px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--ring);color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:11px 12px}
.tile .lab{font-size:12px;color:var(--muted)}
.tile .val{font-size:24px;font-weight:600;margin-top:3px}
.tile .val small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:2px}
.tile .cmp{font-size:11.5px;color:var(--ink2);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
.up{color:var(--up)} .down{color:var(--crit)}
.kpi{border-top:1px solid var(--grid);padding:12px 0}
.kpi:first-child{border-top:0}
.kpi .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kpi .name{font-weight:600;font-size:14px}
.kpi .fact{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:5px;background:var(--s1soft);margin:9px 0 6px;overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--s1)}
.target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.kpi .why{font-size:11.5px;color:var(--muted)}
.kpi .why summary{cursor:pointer;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--ring);
  background:transparent;color:var(--ink2);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);
  border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);
  opacity:0;transition:opacity .1s;z-index:9}
tr.go,tr.sv{cursor:pointer;-webkit-tap-highlight-color:rgba(42,120,214,.15)}
tr.go:hover td,tr.sv:hover td{background:rgba(42,120,214,.06)}
tr.go:active td,tr.sv:active td{background:rgba(42,120,214,.14)}
tr.go td:first-child,tr.sv td:first-child{color:var(--s1);font-weight:600}
td.arrow{font-size:18px;color:var(--s1)}
td.arrow{width:16px;padding-left:0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;
  font:inherit;font-size:13px;color:var(--s1);cursor:pointer}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:-2px 0 10px}
.sum b{font-weight:600;color:var(--ink)}
.who{font-size:11px;color:var(--muted);font-variant-numeric:normal;margin-top:2px}
.pt{padding:10px 0;border-bottom:1px solid var(--grid)}
.pt:last-child{border-bottom:0}
.pt .name{font-weight:600}
.pt .reason{margin-top:3px;font-size:13px;color:var(--crit)}
.why-list{margin:5px 0 0;padding-left:18px;font-size:13px;color:var(--crit)}
.why-list li{margin:1px 0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
  background:var(--surface);border-top:1px solid var(--ring);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;
  padding:11px 4px 12px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.nav button[aria-selected="true"]{color:var(--s1);border-top-color:var(--s1);font-weight:600}
.panel[hidden]{display:none}
.panel h2:first-child{margin-top:14px}
.chk{margin-top:7px;padding-top:7px;border-top:1px dashed var(--grid);font-size:12.5px;color:var(--ink2)}
.chk b{color:var(--crit);font-weight:600}
details.fixed{margin-top:14px}
details.fixed summary{cursor:pointer;font-size:13px;color:var(--s1);padding:8px 0}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.upd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.rel{background:var(--surface);border:1px solid var(--ring);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13px;color:var(--s1);cursor:pointer}
a.rel{text-decoration:none;display:inline-flex;align-items:center}
.rel[disabled]{opacity:.5;cursor:default}
.updWhen{font-size:12px;color:var(--muted)}
#gate{max-width:380px;margin:14vh auto;padding:0 16px;text-align:center}
input{width:100%;padding:13px;font-size:19px;text-align:center;letter-spacing:.14em;
  text-transform:uppercase;border-radius:11px;border:1px solid var(--axis);
  background:var(--surface);color:var(--ink);font-family:inherit}
button.go{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:600;border:0;
  border-radius:11px;background:var(--s1);color:#fff;cursor:pointer}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px}
.exit{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0}
body.wide .wrap{max-width:1500px}
#xpFrame{display:block;width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--ring);border-radius:12px;background:var(--surface)}
</style>
</head>
<body>

<div id="gate">
  <h1>Мой дашборд</h1>
  <p class="sub" style="margin:6px 0 16px">Введи персональный код маршрута — 6 цифр</p>
  <form id="f"><input id="code" type="text" inputmode="numeric" pattern="[0-9]*"
    autocomplete="off" spellcheck="false" placeholder="000000">
  <button class="go" type="submit">Открыть</button></form>
  <div class="err" id="err"></div>
  <p class="note">Код действует только на твой маршрут и запоминается в браузере —
     вводить его каждый раз не нужно. Данные считает отдел аналитики
     KT&amp;G по проверенной выгрузке визитов.</p>
</div>

<main class="wrap" id="app" hidden></main>
<div class="tip" id="tip"></div>

<script>
const ITER = 300000, SALT = "ktng-merch-dashboard-v1";
const $ = s => document.querySelector(s);
const enc = new TextEncoder();
const hex = b => [...b].map(x => x.toString(16).padStart(2,"0")).join("");
const unhex = s => new Uint8Array(s.match(/../g).map(h => parseInt(h,16)));

async function derive(code){
  const km = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt:enc.encode(SALT), iterations:ITER, hash:"SHA-256"}, km, 512));
  const key = await crypto.subtle.importKey("raw", bits.slice(32,64), "AES-GCM", false, ["decrypt"]);
  return {id: hex(bits.slice(0,16)), key};
}
let DATA = null;
async function open(code){
  const data = DATA || (DATA = await (await fetch("data.json?v=" + Date.now())).json());
  const {id, key} = await derive(code);
  const blob = data["блоки"][id];
  if(!blob) return null;
  const raw = unhex(blob);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv: raw.slice(0,12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------- форматирование ---------- */
const nd = "—";
const f1 = v => v===null||v===undefined ? nd : (Math.round(v*10)/10).toLocaleString("ru-RU");
const pc = v => v===null||v===undefined ? nd : f1(v)+" %";
function delta(now, was, unit, name, neutral){
  if(now===null||now===undefined||was===null||was===undefined) return "";
  const d = Math.round((now-was)*10)/10;
  if(d===0) return `<span>без изменений ${name}</span>`;
  const cls = neutral ? "" : (d>0?"up":"down");
  return `<span class="${cls}">${d>0?"▲":"▼"} ${Math.abs(d).toLocaleString("ru-RU")}${unit} ${name}</span>`;
}
function tile(lab, val, unit, cmp){
  return `<div class="tile"><div class="lab">${lab}</div>
    <div class="val">${val}${unit?`<small>${unit}</small>`:""}</div>
    ${cmp?`<div class="cmp">${cmp}</div>`:""}</div>`;
}
/* Метка версии вёрстки: видна внизу страницы. Если человек говорит, что видит
   старое, а здесь стоит свежая дата — значит браузер отдал кэш (27.08.2026). */
const BUILD = "12.10.2026-1";
const LIGHT = {"зелёный":"var(--good)","жёлтый":"var(--warn)","красный":"var(--crit)","н/д":"var(--muted)"};
/* Составляющие рейтинга приходят из движка контроля короткими словами. На странице
   показываем те же формулировки, что на плитках: иначе «сток» в строке слабых мест
   путается со «Стоком на выходе» из KPI (пункт 2 доработки, 26.08.2026). */
/* \b в JS считает границей слова только латиницу и цифры, для кириллицы он не работает —
   поэтому простая глобальная замена: строка слабых мест содержит только названия
   составляющих и числа, ложных срабатываний быть не может. */
function weakNames(str){ return String(str).replace(/сток/g, "сток на выходе"); }

/* ---------- графики ---------- */
const tip = $("#tip");
function showTip(e, html){ tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8);
  tip.style.left = x+"px"; tip.style.top = (e.clientY-tip.offsetHeight-10)+"px"; }
function hideTip(){ tip.style.opacity = 0; }

function bars(rows, key, unit){
  const W=640,H=180,L=34,R=14,T=14,B=26, n=rows.length;
  if(!n) return "<p class='note'>Данных по неделям пока нет.</p>";
  const vals = rows.map(r=>r[key]??0), max = Math.max(...vals,1);
  const bw = Math.min(24,(W-L-R)/n-6), step=(W-L-R)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0,.5,1].forEach(t=>{const y=T+(H-T-B)*(1-t);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
        <text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(max*t).toLocaleString("ru-RU")}</text>`;});
  rows.forEach((r,i)=>{const v=r[key]??0, h=(H-T-B)*(v/max), x=L+step*i+(step-bw)/2, y=H-B-h;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="var(--s1)"
        data-t="${r["неделя"]}: ${f1(v)}${unit}"/>`;
    s+=`<text x="${x+bw/2}" y="${H-B+15}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${String(r["неделя"]).slice(-2)}</text>`;
    if(i===n-1) s+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${f1(v)}</text>`;});
  return s+"</svg>";
}
function line(rows, key, unit){
  const pts = rows.map(r=>r[key]).filter(v=>v!==null&&v!==undefined);
  if(pts.length<2) return "<p class='note'>Для линии нужно минимум две недели с данными.</p>";
  const W=640,H=180,L=34,R=44,T=16,B=26;
  const lo=Math.floor(Math.min(...pts)-2), hi=Math.ceil(Math.max(...pts)+2);
  const x=i=>L+(W-L-R)*(rows.length<2?0:i/(rows.length-1));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [lo,(lo+hi)/2,hi].forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${f1(t)}</text>`;});
  let d="",last=null;
  rows.forEach((r,i)=>{const v=r[key]; if(v===null||v===undefined) return;
    d+=(d?" L":"M")+x(i)+" "+y(v); last=[x(i),y(v),v];});
  s+=`<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  rows.forEach((r,i)=>{const v=r[key]; if(v===null||v===undefined) return;
    s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"
        data-t="${r["неделя"]}: ${f1(v)}${unit}"/>`;
    s+=`<text x="${x(i)}" y="${H-B+15}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${String(r["неделя"]).slice(-2)}</text>`;});
  if(last) s+=`<text x="${last[0]+9}" y="${last[1]+4}" font-size="12" font-weight="600" fill="var(--ink)">${f1(last[2])}${unit}</text>`;
  return s+"</svg>";
}

/* ---------- сборка экрана ---------- */
function weekBlock(p){
  const w=p["неделя"]["факт"], pr=p["неделя"]["пред"], t=p["неделя"]["команда"]||{};
  if(!w) return `<p class="note">За неделю ${p["неделя"]["номер"]||""} визитов по маршруту нет.</p>`;
  const pw = pr ? "к пред. неделе" : "";
  return `<p class="sub" style="margin:-4px 0 10px">${w["период"]||""} · ${w["дней"]} раб. дн.</p>
  <div class="grid">
    ${tile("Визитов", f1(w["визитов"]),"", [delta(w["визитов"],pr&&pr["визитов"],"",pw,true),
        t["визитов"]!=null?`медиана по команде ${f1(t["визитов"])}`:""].filter(Boolean).join(""))}
    ${tile("Эффективность, все визиты", pc(w["эффективность"]),"", [delta(w["эффективность"],pr&&pr["эффективность"]," п.п.",pw),
        t["эффективность"]!=null?`команда ${pc(t["эффективность"])}`:"",
        w["аудиторских"]?`аудиторских ${w["аудиторских"]}`:""].filter(Boolean).join(""))}
    ${tile("Заполненность полки", pc(w["сток"]),"", [delta(w["сток"],pr&&pr["сток"]," п.п.",pw),
        t["сток"]!=null?`команда ${pc(t["сток"])}`:"",
        w["сток визитов"]!=null?`сток ÷ ёмкость · по ${w["сток визитов"]} из ${w["визитов"]} виз.`:""].filter(Boolean).join(""))}
    ${tile("Темп к нормативу", pc(w["темп"]),"", `${f1(w["визитов в день"])} виз./день при норме ${f1(w["норматив"])}`)}
    ${tile("Данные с фото", pc(w["фото"]),"", w["без данных"]?`без данных ${w["без данных"]} виз.`:"все визиты с данными")}
    ${tile("Медиана в ТТ", f1(w["минут"])," мин", w["коротких"]?`короче 10 мин: ${w["коротких"]} виз.`:"коротких визитов нет")}
  </div>`;
}
function monthBlock(p){
  const f=p["месяц"]["факт"], goals=p["kpi цели"]||{};
  const noMan = f["закрыт с"]
    ? `<p class="note" style="margin:-2px 0 10px"><b>Ставка закрыта с ${f["закрыт с"]}.</b>
       План пересчитан на ${f1(f["плановых дней месяца"])} плановых дней до закрытия;
       визиты после этой даты в план не идут.</p>`
    : (f["без исполнителя с"]
      ? `<p class="note" style="margin:-2px 0 10px"><b>Маршрут без исполнителя с ${f["без исполнителя с"]}.</b>
       Показатели посчитаны за отработанные дни: ${f["рабочих дней"]||""}.</p>` : "");
  const neeff = f["неэффективных"], aud = f["аудиторских"]||0, eff = f["эффективных"];
  const nets = (f["сток тянут"]||[]).map(x=>`${x["сеть"]} ${pc(x["сток"])}`).join(" · ");
  const corrGoal = goals["Корректность отчётности"];
  return `<p class="sub" style="margin:-4px 0 10px">${f["период"]||""} · ${f["дней"]} раб. дн.${
      f["плановых дней месяца"]!=null
        ? ` · плановых дней ${f1(f["плановых дней месяца"])}, отработано ${f1(f["отработано дней"])}`
        : ""}</p>${noMan}
  <div class="grid">
    ${tile("Выполнение плана", pc(f["выполнение плана визитов"]),"",
      f["план визитов"]
        ? `${f1(f["визитов"])} из ${f1(f["план визитов"])} визитов за ${f1(f["плановых дней месяца"]||f["плановых дней"])} плановых дн.`
        : (f["нет плановых дней"]
            ? `${f1(f["визитов"])} визитов · по табелю плановых выходов нет`
            : `${f1(f["визитов"])} визитов, план маршрута не найден`))}
    ${tile("Покрыто точек", pc(f["покрытие точек"]),"",
      f["план точек"] ? `${f1(f["точек"])} из ${f1(f["план точек"])} точек от плана на месяц`
                      : `${f1(f["точек"])} точек`)}
    ${tile("Эффективных визитов", pc(f["эффективность"]),"",
      `эффективных ${f1(eff)} · неэффективных ${f1(neeff)}${aud?` · аудиторских ${f1(aud)}`:""}`)}
    ${tile("Call rate", (f["визитов в день"]==null?nd:Number(f["визитов в день"]).toFixed(1).replace(".",",")),"",
      `план ${f1(f["норматив"])} визитов в день`)}
  </div>`;
}
// Одна карточка визита. Причины чекера раскрываем поимённо: строка
// «Чекер нашёл ошибку» человеку у полки ничего не говорит.
function ptCard(r){
  const ch = r["чекер"] || [];
  // если пункты чекера расшифрованы, общая формулировка «Чекер нашёл ошибку» дублирует их
  const why = (r["причины"]||[r["причина"]]).filter(Boolean)
    .filter(x => !(ch.length && /^Чекер нашёл ошибку/.test(x)));
  return `<div class="pt">
    <div class="who">${r["дата"]}${r["визит"]?` · визит ${r["визит"]}`:""}${
      r["исправлено"]?` · <span class="up">исправлено ${r["исправлено"]}</span>`:""}</div>
    <div class="name">${r["точка"]||"точка без названия"}${
      r["код точки"]?` <span class="who">· ${r["код точки"]}</span>`:""}</div>

function kpiBlock(p, boss, scope){
  let s='<div class="card">';
  p["kpi"].forEach(k=>{
    const v=k["факт"], goal=k["цель"], ok=v!==null&&v>=goal;
    const pay=k["доля выплаты"];
    s+=`<div class="kpi">
      <div class="row"><span class="name">${k["kpi"]}</span><span class="fact">${pc(v)}</span></div>
      <div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,v||0))}%"></div>
        <div class="target" style="left:calc(${goal}% - 1px)"></div></div>
      <div class="row"><span class="why">вес ${Math.round(k["вес"]*100)} % · цель ${pc(goal)}</span>
        <span class="chip"><span class="dot" style="background:${ok?"var(--good)":"var(--crit)"}"></span>
        ${ok?"цель взята":"ниже цели"}${pay!==null&&pay!==undefined?` · шкала ${Math.round(pay*100)} %`:""}</span></div>
      <details class="why"><summary>как посчитано</summary>${k["как"]}</details>
    </div>`;});
  return s+`</div><p class="note">Это KPI договора, посчитанные <b>по визитам ${
    scope || (boss?"твоей группы":"твоего маршрута")}</b>
    теми же формулами, что и общий KPI проекта. На твою оплату они напрямую не переносятся —
    договорной KPI считается по проекту целиком.</p>
    <details class="note"><summary>Почему цифры здесь и на вкладке «Месяц» отличаются</summary>
    <p><b>Эффективность.</b> На вкладке «Месяц» показана доля по <b>всем</b> визитам маршрута,
    включая аудиторские. В аудит-сетях (Бристоль, Лукойл, Тебойл, Роснефть) пополнения не бывает
    по определению, поэтому такой визит не может пройти условие «было пополнение» и всегда
    считается неэффективным. KPI договора аудиторские визиты не учитывает — поэтому цифра
    здесь <b>всегда выше</b>, а не наоборот.</p>
    <p><b>Сток.</b> Это две разные метрики, у них разный знаменатель.
    «Заполненность полки» на вкладке «Месяц» = сток на выходе ÷ <b>ёмкость полки</b>: насколько
    полка заполнена физически. «Сток на выходе» здесь = сток на выходе ÷ <b>остаток по ТСД</b>:
    сколько из учтённого товара реально выложено. Числа могут отличаться в обе стороны и это
    не ошибка. Под каждой плиткой подписано, по скольким визитам посчитано: в сетях без норм
    ёмкости заполненность не считается вовсе.</p>
    <p><b>Что из этого влияет на рейтинг.</b> С 27.08.2026 в рейтинг входит
    «Сток на выходе» — тот, что здесь, в KPI договора. «Заполненность полки» на вкладке
    «Месяц» осталась как информация о полке: нормы ёмкости заведены не по всем сетям,
    поэтому в оценке она участвовать не может.</p>
    <p><b>Ещё одно изменение того же дня.</b> Составляющая «данные с фото» из рейтинга
    убрана: региональные сети от требования «С фото» освобождены правилами проекта,
    и рейтинг штрафовал за то, что регламентом разрешено. Теперь у рейтинга пять
    составляющих, и все пять есть у каждого маршрута.</p></details>`;
}
function groupSummary(g){
  const n = k => g.filter(r=>r["светофор"]===k).length;
  const eff = g.map(r=>r["эфф неделя"]).filter(v=>v!=null);
  const up = g.filter(r=>(r["динамика эфф"]||0)>0).length;
  const down = g.filter(r=>(r["динамика эфф"]||0)<0).length;
  const lag = g.filter(r=>r["план ок"]===false);
  const pl = g.map(r=>r["выполнение плана"]).filter(v=>v!=null);
  const exp = pl.length ? pl.reduce((a,b)=>a+b,0)/pl.length : null;
  return `<div class="sum">
    <span>маршрутов <b>${g.length}</b></span>
    <span>не выполняют план: <b class="${lag.length?"down":""}">${lag.length}</b></span>
    ${exp!=null?`<span>план с табелем в среднем <b>${pc(exp)}</b></span>`:""}
  </div>
  <div class="sum">
    <span><span class="dot" style="display:inline-block;background:var(--good)"></span> <b>${n("зелёный")}</b>
      <span class="dot" style="display:inline-block;background:var(--warn);margin-left:8px"></span> <b>${n("жёлтый")}</b>
      <span class="dot" style="display:inline-block;background:var(--crit);margin-left:8px"></span> <b>${n("красный")}</b></span>
    <span>эфф. недели <b>${eff.length?pc(eff.reduce((a,b)=>a+b,0)/eff.length):nd}</b></span>
    <span>к прошлой неделе <b class="up">↑${up}</b> / <b class="down">↓${down}</b></span>
  </div>`;
}
function sortGroup(g){
  const c=[...g];
  if(sortKey==="территория") return c.sort((a,b)=>String(a["территория"]).localeCompare(String(b["территория"])));
  return c.sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(x==null) return 1; if(y==null) return -1;
    // «плохих точек» — по убыванию: у кого больше ошибок, тот сверху.
    // Остальные ключи — по возрастанию: худшие показатели тоже сверху.
    return sortKey==="плохих точек" ? y-x : x-y;
  });
}

function bindSv(p){

}
function bindGroup(p){
  document.querySelectorAll(".tab[data-s]").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.s===sortKey);
    b.onclick=()=>{ sortKey=b.dataset.s; $("#grp").innerHTML=groupTable(p); bindGroup(p); };
  });
  document.querySelectorAll("tr.go").forEach(tr=>{

  });
  const box = document.querySelector('[data-p="group"]');

}

function fail(text){
  let el = document.getElementById("fail");
  if(!el){ el = document.createElement("p"); el.id="fail"; el.className="note";
    el.style.color="var(--crit)"; $("#app").prepend(el); }
  el.textContent = text;
}
async function openBlock(parent, ref){
  try{
    if(!ref) return fail("Нет ключа к этому блоку — пересоберите дашборд.");
    if(!DATA || !DATA["блоки"][ref.id])
      return fail("Блок не найден в data.json. Вероятно, страница и данные из разных сборок: обновите страницу.");
    const raw = unhex(DATA["блоки"][ref.id]);
    const key = await crypto.subtle.importKey("raw", unhex(ref.k), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv: raw.slice(0,12)}, key, raw.slice(12));
    const p = JSON.parse(new TextDecoder().decode(plain));
    p["назад"] = parent;              // цепочка «проект → супервайзер → маршрут»
    render(p);
  }catch(e){ fail("Не удалось открыть: " + (e && e.message ? e.message : e)); }
}
async function openBoss(mgr, name){ return openBlock(mgr, (mgr["доступ рук"]||{})[name]); }

async function openChild(boss, terr){
  return openBlock(boss, (boss["доступ"]||{})[terr]);
}

const SORTS = [["выполнение плана","по выполнению плана"],["рейтинг","по рейтингу"],

function arrow(d, unit){
  if(d===null||d===undefined||d===0) return "";
  return ` <span class="${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d).toLocaleString("ru-RU")}${unit||""}</span>`;
}

const TREND = [["эффективность","Эффективность (все визиты), %"," %","line"],
               ["сток","Заполненность полки, %"," %","line"],
               ["темп","Темп к нормативу, %"," %","line"],
               ["визитов","Визитов за неделю","","bars"]];
function drawTrend(p, k){
  const [key,title,unit,kind]=TREND.find(t=>t[0]===k);
  $("#trend").innerHTML = (kind==="bars"?bars:line)(p["тренд"]||[], key, unit);
  $("#trendTable").innerHTML = `<table><tr><th>Неделя</th><th>${title}</th></tr>` +
    (p["тренд"]||[]).map(r=>`<tr><td>${r["неделя"]}</td><td>${f1(r[key])}${unit}</td></tr>`).join("") + "</table>";
  document.querySelectorAll(".tab[data-k]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k));
}

function xpMount(){
  const p = window._xpP, box = document.getElementById("xpBox");
  if(!p || !box || window._xpDone === p) return;
  const a = p["план к дате"], b = p["av вход"];
  const bad = [["План к дате", a], ["AV на входе", b]].filter(x => !x[1] || x[1]["ошибка"]);
  if(bad.length){
    box.innerHTML = `<div class="card"><p>Вкладка не собрана при последнем обновлении:</p>${bad.map(x=>`<p class="note"><b>${x[0]}</b>: ${x[1] ? x[1]["ошибка"] : "нет данных в блоке"}</p>`).join("")}</div>`;
    window._xpDone = p; return;
  }
  const j = o => JSON.stringify(o).replace(/<\//g, "<\\/");
  const f = document.createElement("iframe");
  f.id = "xpFrame"; f.title = "План и AV";
  f.srcdoc = XP_TPL.replace("__DATA__", () => j(a)).replace("__AVDATA__", () => j(b));
  box.innerHTML = ""; box.appendChild(f); window._xpDone = p;
}

/* Кнопка «Обновить»: сначала сверяем вёрстку — если на сервере лежит другая
   сборка страницы, старый код может не понять новые данные, поэтому
   перезагружаем документ целиком. Если вёрстка та же — меняем только данные,
   не выбрасывая человека на экран ввода кода. */
async function refresh(){
  const btn = $("#rel"), when = $("#updWhen");
  if(!btn) return;
  const ts = Date.now(), back = () => { btn.disabled = false; btn.textContent = "↻ Обновить дашборд"; };
  btn.disabled = true; btn.textContent = "проверяю…";
  try{
    const html = await (await fetch("index.html?v=" + ts, {cache:"no-store"})).text();
    const m = html.match(/const BUILD = "([^"]+)"/);
    if(m && m[1] !== BUILD){
      when.textContent = "вышла новая версия — перезагружаю";
      location.replace(location.pathname + "?v=" + ts);
      return;
    }
    const fresh = await (await fetch("data.json?v=" + ts, {cache:"no-store"})).json();
    const was = DATA && DATA["обновлено"];
    if(fresh["обновлено"] === was){
      back(); when.textContent = "новых данных нет · последние от " + was;
      return;
    }
    DATA = fresh;
    const code = localStorage.getItem("mcode");
    const fresh_p = code ? await open(code) : null;
    if(!fresh_p){
      localStorage.removeItem("mcode");
      $("#app").hidden = true; $("#gate").hidden = false;
      $("#err").textContent = "Код больше не действует — запроси новый у руководителя.";
      return;
    }
    render(fresh_p);
    const w = $("#updWhen");
    if(w) w.textContent = "обновлено · данные от " + fresh["обновлено"];
    scrollTo({top:0});
  }catch(e){
    back();
    when.textContent = "не удалось обновить — проверь интернет";
  }
}

async function go(code){
  $("#err").textContent="Открываю…";
  try{
    const p = await open(code);
    if(!p){
      $("#app").hidden = true; $("#gate").hidden = false;
      $("#err").textContent="Код не найден. Проверь раскладку и попробуй ещё раз.";
      return;
    }
    localStorage.setItem("mcode",code); render(p);
  }catch(e){ $("#err").textContent="Код не подошёл: "+(e.message||e); }
}
$("#code").addEventListener("input", e => {
  // только цифры и не длиннее шести: вставка «1902-00055» не должна
  // молча превращаться в обрезок другого кода
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
});
$("#f").onsubmit=e=>{e.preventDefault();
  const c=$("#code").value.replace(/\D/g,"");
  if(c.length!==6){$("#err").textContent="Код — 6 цифр.";return;} go(c);};
function fromLink(){
  const m = (location.hash||"").match(/k=([A-Za-z0-9]+)/);
  if(!m) return null;
  const code = m[1].toUpperCase();
  // убираем код из адресной строки: он не должен попадать в скриншоты,
  // в «поделиться» и в историю браузера
  history.replaceState(null, "", location.pathname + location.search);
  return code;
}
// Смена только части после «#» документ не перезагружает: браузер считает,
// что это та же страница. Без этого обработчика вторая персональная ссылка
// показывала бы данные первой.
addEventListener("hashchange", () => {
  const c = fromLink();
  if(c) go(c);
});
const link = fromLink();
const saved = link || localStorage.getItem("mcode");
if(saved) go(saved);
</script>
